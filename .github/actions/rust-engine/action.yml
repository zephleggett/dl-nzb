# The Rust engine for the apps, DlNzbCore.xcframework, in one place for every
# job that builds it (ci.yml, release.yml, testflight.yml and
# mac-app-store.yml): Rust with the four Apple targets, the cache of its
# build, and `make -C apple xcframework`.
#
# The release-ffi profile is fat LTO for four targets, so a cold build is most
# of a job. A source change restores the last build of the same Cargo.lock and
# rebuilds only the dl-nzb crates. Only CI saves the cache: a tag or a manual
# run cannot save one anyone else could use, so those restore CI's build of the
# same sources, when main has one.
name: Rust engine
description: Install Rust for the Apple targets, restore (or cache) its build, and build the xcframework
inputs:
  toolchain:
    description: The Rust toolchain, the workflow's RUSTUP_TOOLCHAIN; it is part of the cache key
    required: true
  save-cache:
    description: "true to save the build to the cache at the end of the job, as CI does; otherwise it only restores"
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim

    # The two steps below take the same path and keys: one saves, one restores.
    - name: Cache the Rust build
      if: inputs.save-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'src/**', 'ffi/**') }}
        restore-keys: |
          xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-
          xcframework-${{ inputs.toolchain }}-

    - name: Restore the Rust build
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'src/**', 'ffi/**') }}
        restore-keys: |
          xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-
          xcframework-${{ inputs.toolchain }}-

    - name: Build the xcframework
      shell: bash
      run: make -C apple xcframework
