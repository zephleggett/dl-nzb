# The Rust engine for the apps, DlNzbCore.xcframework, in one place for every
# job that builds it (ci.yml, release.yml, testflight.yml and
# mac-app-store.yml): Rust with the four Apple targets, the cache of its
# build, and `make -C apple xcframework`.
#
# The built framework is cached by the sources it is built from, so a push
# that leaves the Rust alone skips Rust altogether. Otherwise the release-ffi
# profile is fat LTO for four targets, so a cold build is most of a job: a
# source change restores the last build of the same Cargo.lock and rebuilds
# only the dl-nzb crates. (Those rebuild even when nothing changed, as a fresh
# checkout makes every source file newer than the cached build; hence the
# framework cache.) Only CI saves either cache: a tag or a manual run cannot
# save one anyone else could use, so those restore CI's, when main has one.
name: Rust engine
description: Install Rust for the Apple targets, restore (or cache) its build, and build the xcframework
inputs:
  toolchain:
    description: The Rust toolchain, the workflow's RUSTUP_TOOLCHAIN; it is part of the cache key
    required: true
  save-cache:
    description: "true to save the build to the cache at the end of the job, as CI does; otherwise it only restores"
    default: "false"
runs:
  using: composite
  steps:
    # The generated Swift and the licence list are in the key, so a stale
    # commit of either still rebuilds and the job's freshness check sees it.
    - name: Restore the built framework
      id: built
      uses: actions/cache/restore@v4
      with:
        path: apple/DlNzbKit/Frameworks/DlNzbCore.xcframework
        key: xcframework-built-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'src/**', 'ffi/**', 'apple/scripts/build-xcframework.sh', 'apple/DlNzbKit/Sources/DlNzbFFI/**', 'apple/DlNzbKit/Sources/DlNzbUI/Resources/rust-crates.json') }}

    - name: Install Rust
      if: steps.built.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim

    # The two steps below take the same path and keys: one saves, one restores.
    - name: Cache the Rust build
      if: inputs.save-cache == 'true' && steps.built.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'src/**', 'ffi/**') }}
        restore-keys: |
          xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-
          xcframework-${{ inputs.toolchain }}-

    - name: Restore the Rust build
      if: inputs.save-cache != 'true' && steps.built.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'src/**', 'ffi/**') }}
        restore-keys: |
          xcframework-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}-
          xcframework-${{ inputs.toolchain }}-

    - name: Build the xcframework
      if: steps.built.outputs.cache-hit != 'true'
      shell: bash
      run: make -C apple xcframework

    - name: Save the built framework
      if: inputs.save-cache == 'true' && steps.built.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: apple/DlNzbKit/Frameworks/DlNzbCore.xcframework
        key: ${{ steps.built.outputs.cache-primary-key }}
