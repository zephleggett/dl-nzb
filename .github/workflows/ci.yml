# Lint, test and build on every push and pull request.
#
# `changes` sorts the push. The Rust jobs run when the engine or the CLI
# changed; the Apple jobs when anything they are built from changed, which
# includes the Rust, since the apps link it. Docs, Markdown and the site build
# nothing. A skipped job still reports, so a required check is satisfied.
#
# The Apple jobs share one Rust build: `xcframework` builds the engine for
# every Apple target and hands DlNzbCore.xcframework to the Swift tests and
# the Mac app as an artifact.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # rust-toolchain.toml says stable; CI, the release and build-xcframework.sh
  # all build with this one, and the variable wins over that file.
  RUSTUP_TOOLCHAIN: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # a pull request's files come from the API
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sort the changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # every: a file counts only if it matches every line below, so the
          # '!' lines exclude. With the default, some, each line matches on
          # its own and '!docs/**' alone would match README.md.
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!apple/**'
              - '!site/**'
              - '!wrangler.jsonc'
              - '!docs/**'
              - '!**/*.md'
            apple:
              - '**'
              - '!site/**'
              - '!wrangler.jsonc'
              - '!docs/**'
              - '!**/*.md'
        # On a pull request the base is the target branch; on a push to a
        # branch, main; on a push to main, the previous push.

  rust:
    name: Rust on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked
        # The engine, the CLI and the FFI crate's own tests (ffi/).

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck -x -P SCRIPTDIR apple/scripts/*.sh apple/ios/scripts/*.sh
        # -x -P SCRIPTDIR: follow `source common.sh` from the script's own folder

  xcframework:
    name: Rust engine for the apps
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim

      # The release-ffi profile is fat LTO for four targets, so a cold build
      # is most of this job. A source change restores the last build of the
      # same Cargo.lock and rebuilds only the dl-nzb crates.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: xcframework-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'src/**', 'ffi/**') }}
          restore-keys: |
            xcframework-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            xcframework-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Build the xcframework
        run: make -C apple xcframework

      - name: Check the Mac library is universal
        run: |
          archs="$(lipo -archs apple/DlNzbKit/Frameworks/DlNzbCore.xcframework/macos-*/libdl_nzb_ffi.a)"
          echo "macOS library: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "error: want arm64 and x86_64" >&2; exit 1; }

      - name: Check the committed bindings are fresh
        run: |
          # The script regenerates the Swift bindings and the crate licence
          # list, both committed so the package reads without a Rust build.
          # A difference only warns: the jobs below build with the committed
          # Swift. Run `make -C apple xcframework` and commit the result.
          if ! git diff --stat --exit-code apple/DlNzbKit/Sources/DlNzbFFI apple/DlNzbKit/Sources/DlNzbUI/Resources/rust-crates.json; then
            echo "::warning::DlNzbFFI.swift or rust-crates.json differs from what the Rust build generates; run make -C apple xcframework and commit them"
          fi

      - name: Upload the xcframework
        uses: actions/upload-artifact@v4
        with:
          name: DlNzbCore-xcframework
          path: apple/DlNzbKit/Frameworks
          if-no-files-found: error
          retention-days: 1

  apple:
    name: Swift build and tests
    needs: xcframework
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Download the xcframework
        uses: actions/download-artifact@v4
        with:
          name: DlNzbCore-xcframework
          path: apple/DlNzbKit/Frameworks

      - name: Regenerate the Xcode projects
        run: make -C apple mac-project ios-project

      - name: Check the committed projects are fresh
        run: git diff --exit-code apple/macos/dl-nzb.xcodeproj apple/ios/dl-nzb.xcodeproj
        # project.yml is the source of truth; the generated projects are
        # committed so `open` works without xcodegen. Run `make -C apple
        # mac-project ios-project` and commit the result when this fails.

      - name: Run the DlNzbKit tests
        run: make -C apple kit-test

      - name: Run the Mac app's tests
        run: make -C apple mac-test

      - name: Test the iPhone app, or compile it
        run: |
          # The tests need an iOS simulator runtime. A runner image without
          # one still compiles and links the app for iOS, unsigned.
          if xcrun simctl list runtimes available | grep -q '^iOS '; then
            make -C apple ios-test
          else
            echo "::notice::no iOS simulator runtime on this runner: compiling the iPhone app instead of testing it"
            xcodebuild build -project apple/ios/dl-nzb.xcodeproj -scheme "dl-nzb Debug" \
              -destination 'generic/platform=iOS' -derivedDataPath apple/ios/build/DerivedData \
              CODE_SIGNING_ALLOWED=NO
          fi

  mac-app:
    name: Mac app, ad hoc
    needs: xcframework
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Download the xcframework
        uses: actions/download-artifact@v4
        with:
          name: DlNzbCore-xcframework
          path: apple/DlNzbKit/Frameworks

      - name: Build both flavours
        run: make -C apple mac
        # Release and universal, ad hoc: apple/build/appstore and
        # apple/build/direct, the one a release signs.

      - name: Check the app is universal
        run: |
          archs="$(lipo -archs apple/build/direct/dl-nzb.app/Contents/MacOS/dl-nzb)"
          echo "dl-nzb.app: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "error: want arm64 and x86_64" >&2; exit 1; }

      - name: Pack the app
        run: ditto -c -k --keepParent apple/build/direct/dl-nzb.app apple/build/dl-nzb-unsigned.zip

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: dl-nzb-mac-unsigned
          path: apple/build/dl-nzb-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  swift-format:
    name: Swift formatting
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Lint the Swift sources
        run: |
          xcrun swift-format lint --strict --configuration apple/.swift-format --recursive \
            apple/macos/DlNzb apple/macos/DlNzbTests apple/ios/DlNzb apple/ios/DlNzbTests \
            apple/DlNzbKit/Sources apple/DlNzbKit/Tests apple/DlNzbKit/Package.swift
        # DlNzbFFI.swift is UniFFI's and opts out (swift-format-ignore-file).
