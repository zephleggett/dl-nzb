[package]
name = "dl-nzb"
version = "0.8.0-rc.2"
edition = "2021"
rust-version = "1.85.0"
authors = ["Zeph <zeph@example.com>"]
description = "A fast, modern NZB downloader with built-in PAR2 repair and RAR extraction"
readme = "README.md"
homepage = "https://github.com/zephleggett/dl-nzb"
repository = "https://github.com/zephleggett/dl-nzb"
license = "GPL-2.0"
keywords = ["nzb", "usenet", "downloader", "nntp", "par2"]
categories = ["command-line-utilities", "network-programming"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lib]
name = "dl_nzb"
path = "src/lib.rs"

[[bin]]
name = "dl-nzb"
path = "src/main.rs"
# The binary is the terminal front end; the library builds without it
# (`cargo build --lib --no-default-features`) for the Apple apps.
required-features = ["cli"]

# `ffi/` (crate `dl-nzb-ffi`) wraps the engine for the Apple apps with UniFFI.
# Plain `cargo build`/`cargo test` here still mean the CLI crate only (the root
# package is the default member); `--workspace` or `-p dl-nzb-ffi` reaches the
# bindings.
[workspace]
members = [".", "ffi"]

[profile.release]
# Optimize for speed (trading ~2MB for ~20% performance gain)
opt-level = 3       # Maximum speed optimization
lto = "fat"         # Full Link Time Optimization across all crates
codegen-units = 1   # Better optimization (slower compile, faster runtime)
panic = "abort"     # Smaller binary size
strip = true        # Remove debug symbols

# Release build for the FFI static library embedded in the Apple apps. Panics
# must unwind so UniFFI can turn them into errors at the boundary instead of
# aborting the host app.
[profile.release-ffi]
inherits = "release"
panic = "unwind"

# Fast release build for development/testing
[profile.release-fast]
inherits = "release"
opt-level = 3       # Maximum speed optimization
lto = "thin"        # Faster LTO, good balance

[features]
default = ["cli"]
# The terminal front end: argument parsing, progress bars, log formatting and
# signal handling. Off for library consumers (the Apple apps via `ffi/`), so
# nothing terminal-related is compiled into them.
cli = ["dep:clap", "dep:indicatif", "dep:human_bytes", "dep:tracing-subscriber", "tokio/signal"]
# Enable vendored OpenSSL for cross-compilation
vendored-openssl = ["openssl/vendored"]

[dependencies]
# OpenSSL (explicit dependency for vendored feature support)
openssl = { version = "0.10", optional = true }
# Async runtime and networking
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
# CancellationToken for per-job stop
tokio-util = "0.7"
tokio-native-tls = "0.3"
native-tls = "0.2"

# Connection pooling
deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# File formats
nzb-rs = { version = "0.5", features = ["serde"] }

# Async utilities
futures = "0.3"
bytes = "1.11"
async-trait = "0.1"
# Lock-free MPMC channel for article-granularity work distribution across workers
flume = "0.11"
# SIMD CRC32 (IEEE/zlib polynomial) for yEnc per-article verification — an order
# of magnitude faster than the scalar table CRC on PCLMULQDQ-capable CPUs.
crc32fast = "1.4"
# SIMD byte search: yEnc escapes and the line ends of article bodies.
memchr = "2.7"
# Low-level socket tuning (SO_RCVBUF, TCP keepalive) on the NNTP connections.
socket2 = { version = "0.5", features = ["all"] }

# Error handling
thiserror = "1.0"

# Progress and UI (terminal front end only)
indicatif = { version = "0.17", optional = true }
human_bytes = { version = "0.4", optional = true }

# System utilities
dirs = "5.0"
once_cell = "1.19"
regex = "1.11"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

# Post-processing dependencies
unrar = "0.5"
# The raw unRAR DLL API (already built by `unrar`): extraction goes through it
# directly so its data callback can stop mid-member and report progress, and
# passwords reach unRAR as wide strings.
unrar_sys = "0.5"
widestring = "1"

# PAR2 support (pure Rust with SIMD optimizations).
# v0.3.1 fixes block-count inflation from duplicated FileDescription packets
# (repair/verify failing on large multi-file / obfuscated sets).
par2-rs = { git = "https://github.com/zephleggett/par2-rs.git", tag = "v0.3.1" }

# Unix-only: the engine raises the open-file limit (a download holds one fd per
# output file, and large NZBs have hundreds, plus connections; the inherited soft
# limit is often only 256 on macOS) and checks free disk space with statvfs.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"
