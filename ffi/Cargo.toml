[package]
name = "dl-nzb-ffi"
version = "0.8.0"
edition = "2021"
rust-version = "1.85.0"
description = "UniFFI bindings for the dl-nzb engine, for the Mac, iPhone and iPad apps"
license = "GPL-2.0"
repository = "https://github.com/zephleggett/dl-nzb"
publish = false

[lib]
name = "dl_nzb_ffi"
# staticlib: linked into the apps through DlNzbCore.xcframework.
# lib: lets `uniffi-bindgen` and the unit tests link the crate.
crate-type = ["staticlib", "lib"]

[[bin]]
# The bindings generator, pinned to the same UniFFI as the scaffolding (a
# mismatched generator produces bindings that fail their checksum at runtime).
# Only apple/scripts/build-xcframework.sh runs it.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only for the uniffi-bindgen binary; the library itself needs none of
# UniFFI's default features (cargo-metadata would be linked into the apps).
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
# The engine without the terminal front end.
dl-nzb = { path = "..", default-features = false }
uniffi = { version = "=0.32.2", default-features = false }
tokio = { version = "1.45", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
